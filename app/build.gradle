plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        applicationId "com.enecchii.rejuvdual"
        minSdk 23
        targetSdk 33
        versionCode 3
        versionName "0.2.0"
        archivesBaseName = "rejuv-dual-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    // A fixed, public "debug" key committed to the repo so every CI build is
    // signed the same way and installs as an update over the previous one.
    // It protects nothing; it only keeps signatures consistent.
    signingConfigs {
        shared {
            storeFile file('rejuv-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.shared
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // You can build also 'x86' and 'x86_64' if you want (useful for AVD debugging)
            include 'arm64-v8a'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
