name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: 23.2.8568313

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake curl gpg xxd \
            autoconf automake libtool pkg-config python3 git unzip

      # The Ruby cross-build needs a host Ruby of the same minor version.
      - name: Set up host Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      # The runner image ships the Android SDK; just add the NDK we need.
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${ANDROID_NDK_VERSION}"
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ARCH=linux-x86_64" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # Native dependencies (Ruby, OpenSSL, SDL2, …) take a long time to
      # download and compile, so cache them. The key only changes when the
      # dependency scripts change, not when our own code does.
      - name: Restore native dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            app/jni/libogg
            app/jni/libvorbis
            app/jni/libtheora
            app/jni/libiconv
            app/jni/uchardet
            app/jni/pixman
            app/jni/physfs
            app/jni/openal
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_ttf
            app/jni/SDL2_sound
            app/jni/openssl
            app/jni/ruby
            app/jni/build-arm64-v8a
          key: native-deps-arm64-v1-${{ hashFiles('app/jni/get_deps.sh', 'app/jni/Makefile', 'app/jni/preconfigured/**') }}

      - name: Download native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh

      - name: Compile native dependencies (arm64-v8a)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: |
          HOST=aarch64-linux-android \
          TARGET=aarch64-linux-android \
          ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" \
          make -j"$(nproc)"

      - name: Link build folder alias
        working-directory: app/jni
        run: |
          if [ -d build-arm64-v8a ] && [ ! -e build-arm64 ]; then ln -s build-arm64-v8a build-arm64; fi

      - name: Generate embedded assets (xxd)
        working-directory: app/jni/mkxp-z
        run: |
          chmod +x make_xxd.sh
          ./make_xxd.sh

      - name: Check companion mod syntax
        run: ruby -c app/src/main/assets/companion/companion.rb

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p out
          cp "$APK" "out/rejuv-dual-${SHORT}.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rejuv-dual-apk
          path: out/*.apk
          retention-days: 30
